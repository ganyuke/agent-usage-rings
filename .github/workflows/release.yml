name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build and release extension zip
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Check release version
        id: release
        shell: bash
        run: |
          version="$(jq -r '."version-name"' src/metadata.json)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match metadata.json version-name v$version" >&2
            exit 1
          fi

          uuid="$(jq -r '.uuid' src/metadata.json)"
          artifact="dist/${uuid}.shell-extension.zip"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Build extension zip
        run: ./scripts/pack.sh

      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ steps.release.outputs.artifact }}
          subject-version: ${{ github.ref_name }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.release.outputs.artifact }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARTIFACT" \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
